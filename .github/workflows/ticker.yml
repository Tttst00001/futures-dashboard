name: 定时调度链

# GitHub 的 schedule 事件在本仓库实测 0 次生效（高负载会被丢弃），改由这条链主动 dispatch 构建。
# push 一次即可点亮链条，之后它一直睡到各自的更新时刻并交棒，不依赖任何外部服务。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: ticker
  cancel-in-progress: true

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: 睡到下一个更新时刻并交棒
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/schedule_tick.py
